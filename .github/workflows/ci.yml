name: CI

on:
  push:
    branches: [main, cheap-organized-rebuild]
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    env:
      # prisma validate needs a URL shape; no real DB access in CI
      DATABASE_URL: postgresql://ci:ci@localhost:5432/ci?schema=public
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run validate
      - run: npm run typecheck
      - run: npm run lint
